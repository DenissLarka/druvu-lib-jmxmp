# Builds and verifies the project on every push to main and on every pull request.
# This is the gate that catches breakage (e.g. Renovate dependency bumps) before
# it lands on main — the publish workflows only run on release, so without this a
# red build stays invisible until release time.
#
# JDK 25 builds it; the code targets Java 21 (java.version), which the enforcer requires
# as a minimum. `verify` also runs the integration-test (it) and module-path (validation)
# modules.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify
        run: mvn -B verify
